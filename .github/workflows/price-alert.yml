name: Price Alert

on:
  schedule:
    # Every 10 min, Mon-Fri, 13:00-21:59 UTC = covers the US session
    # (9:30am-4pm New York) in both daylight-saving and standard time.
    - cron: "*/10 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "once = normal check, test = send a test message"
        default: once
        type: choice
        options: [once, test]

permissions:
  contents: write          # lets the job commit alert_state.json

concurrency:
  group: price-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTS_JSON:        ${{ secrets.ALERTS_JSON }}
          ALERT_KEY_SECRET:   ${{ secrets.ALERT_KEY_SECRET }}
          SHEET_URL:          ${{ secrets.SHEET_URL }}
          SHEET_TOKEN:        ${{ secrets.SHEET_TOKEN }}
        run: python price_alert.py --${{ github.event.inputs.mode || 'once' }}

      - name: Save fired-alert state
        run: |
          if [ -f alert_state.json ] && [ -n "$(git status --porcelain alert_state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add alert_state.json
            git commit -m "Update alert state"
            # Rebase onto anything pushed since checkout, retrying a few times,
            # so a rejected push doesn't lose state and re-fire alerts.
            for i in 1 2 3; do
              git pull --rebase && git push && exit 0
              sleep 5
            done
            echo "Could not push alert state" >&2
            exit 1
          fi
